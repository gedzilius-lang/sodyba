services:
  radar:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      SR_REFRESH_HOUR: "4"
      SR_REFRESH_ON_BOOT: "true"
      SR_REQUEST_DELAY: "1.0"
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; Caddy terminates TLS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [radar]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
